<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<style>
    table{
         body{
            background-color: #737fdd;
            font-family: Arial, sans-serif;
            margin:  25% 35% ;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #232339;
            padding: 8px;
            text-align: center;
            
        }
        th {
            background-color: #4141ce;
            color: #e0d4cf;
        }
        tr{
            background-color: rgb(89, 133, 133);
        }
    }
</style>
<body>
    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>HTML</th>
            <th>CSS</th>
            <th>Total</th>
        </tr>
        <tr>
            <td>135</td>
            <td>John</td>
            <td>35</td>
            <td>40</td>
            <td>75</td>
        </tr>
        <tr>
            <td>136</td>
            <td>Aseel</td>
            <td>40</td>
            <td>50</td> 
              <td>90</td>
        </tr>
        <tr>
            <td>137</td>
            <td>Jasna</td>
            <td>10</td>
            <td>30</td> 
              <td>40</td>
        </tr>
    </table>
</body>
</html>
